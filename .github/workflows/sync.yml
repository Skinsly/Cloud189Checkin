name: Sync Fork with Upstream
on:
  schedule:
    - cron: "0 0 * * *"  # 每天UTC 0点执行
  workflow_dispatch:     # 支持手动触发
jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.event.repository.fork  # 仅Fork仓库执行
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: wes-lin/Cloud189Checkin  # 如：owner/repo
          upstream_sync_branch: main       # 上游分支名
          target_sync_branch: main          # 本地Fork分支名
